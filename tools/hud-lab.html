<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HUD lab</title>
<style>
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070b}
  #app{position:fixed;inset:0;background:#0b1620 center/cover no-repeat}
  #lab-bar{position:fixed;left:50%;bottom:10px;translate:-50% 0;z-index:50;display:flex;gap:6px;align-items:center;padding:6px 8px;border-radius:10px;
    background:rgba(8,10,14,.86);box-shadow:0 0 0 1px rgba(255,255,255,.12),0 10px 30px rgba(0,0,0,.5);font:600 12px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#eee;pointer-events:auto}
  #lab-bar button{all:unset;cursor:pointer;padding:7px 10px;border-radius:6px;color:#cfd3da;letter-spacing:.04em}
  #lab-bar button:hover{background:rgba(255,255,255,.08)}
  #lab-bar button[aria-pressed="true"]{background:#f3efe6;color:#0a0c10}
  #lab-bar i{width:1px;height:20px;background:rgba(255,255,255,.15);margin:0 4px}
  #lab-bar output{min-width:44px;text-align:right;font-variant-numeric:tabular-nums;color:#8f96a3}
  body.clean #lab-bar{display:none}
</style>
</head>
<body>
<div id="app"></div>
<div id="lab-bar"></div>
<script type="module" src="./hud-lab.ts"></script>
</body>
</html>
