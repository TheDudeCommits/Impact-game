<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,viewport-fit=cover">

<title>{{TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}">
<meta name="application-name" content="{{TITLE}}"><meta name="apple-mobile-web-app-title" content="{{SHORT_TITLE}}"><meta name="theme-color" content="#cc202b">
<link rel="canonical" href="{{PUBLIC_URL}}">
<link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32"><link rel="icon" href="/favicon-16.png" type="image/png" sizes="16x16">
<link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="manifest" href="/site.webmanifest">
<link rel="preload" href="/assets/home/fonts/electroharmonix.otf" as="font" type="font/otf" crossorigin>
<style>/* The page before the game is ready: #boot, a panel of manga ink over everything - the game's mark, crisp at any
size (scripts/build/bootPlugin.ts inlines it), focus lines that boil like a hand-drawn page, the name in the game's lettering
(the preloaded Electroharmonix under a name of its own, held back until it has come rather than drawn first in another
face), and a bar that follows the bytes as they arrive. Inline, so it paints with the page's first bytes; the build puts
style.css after #app (vite.config.ts). It stays over the game until the game is ready (src/boot/bootScreen.ts), and keeps
still for prefers-reduced-motion. */
#boot{position:fixed;inset:0;z-index:2147483000;display:grid;place-items:center;overflow:hidden;pointer-events:none;color:#111;background:radial-gradient(#11111114 .7px,transparent .9px) 0 0/5px 5px,#fff;box-shadow:inset 0 0 0 6px #111;transition:opacity .3s ease}
#boot.boot-done{opacity:0}
@font-face{font-family:BootLettering;src:url('/assets/home/fonts/electroharmonix.otf') format('opentype');font-display:block}
.boot-lines{position:absolute;left:50%;top:50%;width:200vmax;height:200vmax;margin:-100vmax 0 0 -100vmax;background:repeating-conic-gradient(#111 0 .5deg,#0000 .5deg 7deg),repeating-conic-gradient(from 3deg,#111 0 .3deg,#0000 .3deg 11deg);-webkit-mask:radial-gradient(closest-side,#0000 13vmax,#000b 26vmax,#000 44vmax);mask:radial-gradient(closest-side,#0000 13vmax,#000b 26vmax,#000 44vmax);opacity:.9;animation:boot-boil .36s steps(1) infinite,boot-in .5s ease-out both}
.boot-card{position:relative;display:grid;justify-items:center;gap:clamp(12px,2.2vmin,20px);padding:clamp(18px,3vmin,28px) clamp(22px,4vmin,40px);background:#fff;border:3px solid #111;box-shadow:7px 7px 0 #cc202b;animation:boot-slam .5s cubic-bezier(.2,1.5,.45,1) both}
.boot-mark{width:clamp(88px,15vmin,132px);aspect-ratio:1;background:url(/*BOOT_MARK*/) center/contain no-repeat #100f12;border:3px solid #111}
.boot-word{font:400 clamp(30px,6.4vmin,56px)/.9 BootLettering,Impact,'Arial Narrow',sans-serif;letter-spacing:.05em;transform:skewX(-8deg);animation:boot-word .55s .12s cubic-bezier(.2,1.3,.4,1) both}
.boot-bar{position:relative;display:block;width:clamp(170px,30vmin,250px);height:9px;border:2px solid #111;transform:skewX(-18deg);overflow:hidden;background:#fff}
.boot-bar>i{position:absolute;inset:0;background:#111;transform-origin:0 50%;transform:scaleX(var(--p,0));transition:transform .4s cubic-bezier(.3,.7,.3,1)}
.boot-bar>i::after{content:'';position:absolute;right:0;top:0;bottom:0;width:4px;background:#cc202b}
.boot-note{min-height:1em;font:400 11px/1 BootLettering,Impact,sans-serif;letter-spacing:.18em;color:#cc202b}
@keyframes boot-boil{0%{transform:rotate(0)}33%{transform:rotate(1.4deg) scale(1.01)}66%{transform:rotate(-.9deg) scale(.995)}}
@keyframes boot-in{from{opacity:0}}
@keyframes boot-slam{from{opacity:0;transform:scale(1.18) rotate(-2deg)}}
@keyframes boot-word{from{opacity:0;transform:translateX(-18px) skewX(-8deg)}}
@media (prefers-reduced-motion:reduce){#boot *{animation:none!important}.boot-bar>i{transition:none}}</style>
<meta property="og:type" content="website"><meta property="og:site_name" content="{{TITLE}}"><meta property="og:url" content="{{PUBLIC_URL}}">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESCRIPTION}}">
{{SOCIAL_IMAGE}}<meta name="twitter:card" content="{{TWITTER_CARD}}"><meta name="twitter:title" content="{{TITLE}}">
<meta name="twitter:description" content="{{DESCRIPTION}}">
</head><body><div id="boot" aria-hidden="true"><i class="boot-lines"></i><div class="boot-card"><b class="boot-mark"></b><b class="boot-word">{{TITLE_UPPER}}</b><i class="boot-bar"><i></i></i><small class="boot-note">LOADING</small></div></div>
<script>/* #boot's bar, from the bytes of the files the page loads before the game can start (the build writes their sizes
in: scripts/build/bootPlugin.ts), each counted as it completes; src/boot/bootScreen.ts ends it once the game is ready, and
an error before then takes it away so the page under it shows. */
(function(){var boot=document.getElementById('boot');if(!boot)return;var sizes=/*BOOT_BYTES*/[],total=0,sum=0,seen={},wait=[],i,note=boot.querySelector('.boot-note'),watch;
for(i=0;i<sizes.length;i++)total+=sizes[i];
function set(p){boot.style.setProperty('--p',p.toFixed(3));if(note)note.textContent='LOADING '+Math.round(p*100)+'%';}
function count(name){var files=document.querySelectorAll('script[type="module"][src],link[rel="modulepreload"][href],link[rel="stylesheet"][href]'),j,url;
for(j=0;j<files.length;j++){url=files[j].src||files[j].href;if(url===name){if(!seen[name]){seen[name]=1;sum+=sizes[j]||0;}return true;}}return false;}
function done(e){var name=e.name.split('#')[0];if(!count(name))wait.push(name);wait=wait.filter(function(n){return !count(n);});if(total)set(.05+.87*Math.min(1,sum/total));}
set(.05);
// (The version list, asked for early at a site's root; never inside a build served under a folder of its own, where the
// game does not read it: src/loading/assetVersions.ts.)
if(sizes.length&&location.pathname.lastIndexOf('/')===0){var pre=document.createElement('link');pre.rel='preload';pre.as='fetch';pre.crossOrigin='anonymous';pre.href='asset-versions.json';document.head.appendChild(pre);}
try{watch=new PerformanceObserver(function(list){list.getEntries().forEach(done);});watch.observe({type:'resource',buffered:true});}catch(e){}
window.__bootDone=function(){if(boot.dataset.done)return;boot.dataset.done='1';try{watch&&watch.disconnect();}catch(e){}set(1);
setTimeout(function(){boot.classList.add('boot-done');setTimeout(function(){boot.remove();},320);},140);};
addEventListener('error',function(){if(!boot.dataset.done)window.__bootDone();});})();</script>
<div id="app" data-brand="{{TITLE_UPPER}}"></div><script type="module" src="/src/main.ts"></script></body></html>
