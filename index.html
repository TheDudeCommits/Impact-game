<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,viewport-fit=cover">

<title>{{TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}">
<meta name="application-name" content="{{TITLE}}"><meta name="apple-mobile-web-app-title" content="{{SHORT_TITLE}}"><meta name="theme-color" content="#cc202b">
<link rel="canonical" href="{{SITE_URL}}/">
<link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32"><link rel="icon" href="/favicon-16.png" type="image/png" sizes="16x16">
<link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="manifest" href="/site.webmanifest">
<link rel="preload" href="/assets/home/fonts/electroharmonix.otf" as="font" type="font/otf" crossorigin>
<style>/* The page before the game's script has drawn anything (#app still empty) is the home's paper with the game's mark in ink,
gone the moment the script mounts the canvas and the interface. Inline, so it paints with the page's first bytes; the build puts
style.css after #app (vite.config.ts). The title under the mark is #app's data-brand, filled from src/originals/brand.ts. */
#app:empty{background:#fff}
#app:empty::before{content:'';position:fixed;left:50%;top:calc(50% - 34px);width:86px;height:86px;transform:translate(-50%,-50%);background:url('/favicon.svg') center/contain no-repeat;animation:boot-mark 1.1s ease-in-out infinite alternate}
#app:empty::after{content:attr(data-brand);position:fixed;left:0;right:0;top:calc(50% + 28px);text-align:center;color:#111;font:italic 900 clamp(22px,3.2vw,38px)/1 Impact,'Arial Narrow',sans-serif;letter-spacing:.02em}
@keyframes boot-mark{to{transform:translate(-50%,-50%) scale(1.07)}}
@media (prefers-reduced-motion:reduce){#app:empty::before{animation:none}}</style>
<meta property="og:type" content="website"><meta property="og:site_name" content="{{TITLE}}"><meta property="og:url" content="{{SITE_URL}}/">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESCRIPTION}}">
{{SOCIAL_IMAGE}}<meta name="twitter:card" content="{{TWITTER_CARD}}"><meta name="twitter:title" content="{{TITLE}}">
<meta name="twitter:description" content="{{DESCRIPTION}}">
</head><body><div id="app" data-brand="{{TITLE_UPPER}}"></div><script type="module" src="/src/main.ts"></script></body></html>
